<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this, mobile browsers lay the page out at a 980px virtual width and then
     scale it down to the device, squishing the UI and adding a fractional CSS scale on top
     of the canvas bitmap. user-scalable=no stops native pinch-zoom fighting the chart. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nucleus Charts — @nucleuscharts/financial demo</title>
<style>
  :root {
    color-scheme: light;
    --demo-surface: #fff;
    --demo-panel: #f7f8fa;
    --demo-control: #fff;
    --demo-text: #191919;
    --demo-muted: #787b86;
    --demo-border: #e0e3eb;
    --demo-control-border: #d0d3da;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --demo-panel: #121212;
    --demo-control: #181818;
    --demo-muted: #a3a7b1;
    --demo-control-border: #303030;
  }
  html, body { margin: 0; height: 100%; background: var(--demo-surface); color: var(--demo-text); font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { padding: 8px 10px; font-size: 12px; color: var(--demo-text); background: var(--demo-surface);
         border-bottom: 1px solid var(--demo-border); display: flex; gap: 7px; align-items: stretch;
         align-content: flex-start; flex-wrap: wrap; }
  #bar .group { position: relative; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
                padding: 10px 9px 5px; margin-top: 3px; background: var(--demo-panel);
                border: 1px solid var(--demo-border); border-radius: 6px; }
  /* The flex display above would otherwise beat the UA [hidden] rule (specificity) — the style
     groups toggle via the `hidden` attribute, so it must win here. */
  #bar .group[hidden] { display: none; }
  #bar .group::before { content: attr(data-caption); position: absolute; top: -8px; left: 8px;
                padding: 0 5px; background: var(--demo-surface); font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em;
                text-transform: uppercase; color: var(--demo-muted); }
  #bar label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  #bar button, #bar select, #bar input[type="text"], #bar input[type="number"] {
    min-height: 23px; box-sizing: border-box; background: var(--demo-control); color: var(--demo-text);
    border: 1px solid var(--demo-control-border); border-radius: 4px;
  }
  #bar button { padding: 2px 8px; cursor: pointer; }
  #bar button:hover { border-color: #26a69a; }
  #bar button:focus-visible, #bar select:focus-visible, #bar input:focus-visible { outline: 2px solid #26a69a; outline-offset: 1px; }
  #bar input[type="color"] { width: 24px; height: 21px; padding: 0; border: 1px solid var(--demo-control-border); border-radius: 4px; background: var(--demo-control); cursor: pointer; }
  #bar input[type="range"] { width: 72px; vertical-align: middle; }
  #bar .brand { align-self: center; background:#26a69a; color:#fff; padding:4px 7px; border-radius:4px; font-weight: 700; }
  #bar .hint { color: var(--demo-muted); font-size: 11px; }
  #status { align-self: center; margin-left: auto; color: var(--demo-muted); font-variant-numeric: tabular-nums; }
  /* The library creates and manages the canvases inside this container. */
  #chart_wrap { flex: 1; position: relative; min-height: 0; }
  #chart_container { position: absolute; inset: 0; touch-action: none; overscroll-behavior: none; }
  /* crosshair-move legend (top-left, over the pane) driven by subscribe_crosshair_move */
  #legend { position: absolute; top: 8px; left: 8px; z-index: 3; font-size: 12px; color: var(--demo-text);
            background: color-mix(in srgb, var(--demo-surface) 72%, transparent); padding: 3px 7px; border-radius: 3px; pointer-events: none;
            font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="wrap">
  <header id="bar">
    <span class="brand">@nucleuscharts/financial</span>

    <div class="group" id="type_group" data-caption="Series">
      <label><input type="radio" name="series" value="candlestick" checked> candles</label>
      <label><input type="radio" name="series" value="bar"> bars</label>
      <label><input type="radio" name="series" value="line"> line</label>
      <label><input type="radio" name="series" value="area"> area</label>
      <label><input type="radio" name="series" value="baseline"> baseline</label>
    </div>

    <!-- candle/bar colors: body, wick, and border per direction + part visibility -->
    <div class="group" id="candle_style" data-caption="Candle style">
      <label>up <input type="color" id="up_color" value="#26a69a"></label>
      <label>down <input type="color" id="down_color" value="#ef5350"></label>
      <label>wick up <input type="color" id="wick_up_color" value="#26a69a"></label>
      <label>wick dn <input type="color" id="wick_down_color" value="#ef5350"></label>
      <label>border up <input type="color" id="border_up_color" value="#26a69a"></label>
      <label>border dn <input type="color" id="border_down_color" value="#ef5350"></label>
      <label><input type="checkbox" id="wick_visible" checked> wicks</label>
      <label><input type="checkbox" id="border_visible" checked> borders</label>
      <button id="candle_parts_reset" type="button" title="Reset wick/border colors to follow the body colors">reset parts</button>
    </div>

    <!-- line/area stroke -->
    <div class="group" id="line_style" data-caption="Line style" hidden>
      <label>color <input type="color" id="line_color" value="#2196f3"></label>
      <label>width <input type="range" id="line_width" min="1" max="8" step="1" value="3"><span id="line_width_val">3</span></label>
    </div>

    <!-- area fill -->
    <div class="group" id="area_style" data-caption="Area style" hidden>
      <label>fill <input type="color" id="area_top" value="#2edc87"></label>
    </div>

    <div class="group" data-caption="Overlays">
      <label><input type="checkbox" id="sma_toggle"> SMA(20)</label>
      <label><input type="checkbox" id="vol_toggle"> volume</label>
    </div>

    <div class="group" data-caption="Separate pane">
      <label title="RSI(14) oscillator in its own stacked pane (series.move_to_pane): dedicated price scale, draggable separator, crosshair + selection anchors work across panes; unchecking prunes the empty pane"><input type="checkbox" id="rsi_toggle"> RSI(14)</label>
    </div>

    <div class="group" data-caption="Multi-chart" title="Split into independent charts (engine workspace): each cell is a full chart with its own scales, type, and data. Click a chart to make it active — split/close, series type, and style then act on it; drag the divider to resize.">
      <button id="split_h" type="button" title="Split the active chart side by side">split ↔</button>
      <button id="split_v" type="button" title="Split the active chart stacked">split ↕</button>
      <button id="close_cell" type="button" title="Close the active chart (not the primary one)">close</button>
      <label title="Paywall-style cap on live charts (the workspace's usage signal reports every change)">max
        <select id="max_charts">
          <option value="0" selected>∞</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <span class="hint" id="grid_usage"></span>
    </div>

    <div class="group" data-caption="Plugins">
      <label title="Pane primitive (plugin platform): alternating day shading behind the series"><input type="checkbox" id="bands_toggle"> day bands</label>
      <label title="Series primitive (plugin platform): position band with a price-axis tag on the main series"><input type="checkbox" id="pos_band_toggle"> position band</label>
      <label title="Series primitive (plugin platform): autoscale-expanding band beyond the data"><input type="checkbox" id="scale_band_toggle"> scale band</label>
      <label title="Custom series (plugin platform): the reference rounded-candles plugin example, drawn by the plugin"><input type="checkbox" id="custom_toggle"> rounded candles</label>
      <label title="Built-in plugin (reference createSeriesMarkers): the markers fixture drawn by the plugin platform — A/B against ?feature=markers (engine markers)"><input type="checkbox" id="plugin_markers_toggle"> plugin markers</label>
      <label title="Built-in plugin (reference createTextWatermark): two-line watermark painted through the overlay-text hook"><input type="checkbox" id="plugin_watermark_toggle"> plugin watermark</label>
      <label title="Canvas primitive (plugin platform C-e): the reference vertical-line plugin example, painted with raw Canvas2D calls on the plugin overlay"><input type="checkbox" id="vertline_toggle"> vert line</label>
    </div>

    <div class="group" id="drawings_group" data-caption="Drawings" title="Engine-owned drawing tools (TradingView-style): click a tool, then click the chart to place its anchors (two clicks for trend/rect). Click a drawing to select it — drag its anchor handles to re-anchor, drag the body to move it; Delete/Backspace removes the selection, Escape deselects/cancels. Hold Ctrl to magnet-snap the crosshair and drawing anchors to the nearest bar's OHLC; hold Shift to straighten a dragged anchor to 0°/45°/90° (a rectangle to a square) or a body move to one axis.">
      <button type="button" data-tool="trend_line" title="Trend line: two-anchor segment">trend</button>
      <button type="button" data-tool="horizontal_line" title="Horizontal line across the pane at a price">h-line</button>
      <button type="button" data-tool="horizontal_ray" title="Horizontal ray from the anchor to the right edge">h-ray</button>
      <button type="button" data-tool="vertical_line" title="Vertical line spanning the pane at a bar">v-line</button>
      <button type="button" data-tool="rectangle" title="Rectangle between two corners">rect</button>
      <button type="button" data-tool="text" title="Text label at a point (uses the label text below)">text</button>
      <button type="button" data-tool="brush" title="Freehand brush: drag to draw a smooth stroke; when selected its two end anchors re-anchor, the body moves">brush</button>
      <label title="Stroke/border color — templates new drawings and applies live to the selected one">color <input type="color" id="drawing_color" value="#2962ff"></label>
      <label title="Stroke style (solid/dotted/dashed) — templates new drawings and applies live to the selected one">style
        <select id="drawing_style">
          <option value="solid" selected>solid</option>
          <option value="dotted">dotted</option>
          <option value="dashed">dashed</option>
        </select>
      </label>
      <label title="Stroke width in CSS px — templates new drawings and applies live to the selected one">w <input type="range" id="drawing_width" min="1" max="8" step="1" value="2"><span id="drawing_width_val">2</span></label>
      <label title="Text label carried by newly created drawings (any tool)">label <input type="text" id="drawing_text" size="8"></label>
      <label title="Label text color — templates new drawings and applies live to the selected one">text <input type="color" id="drawing_text_color" value="#0a0a0a"></label>
      <label title="Label font size in CSS px — templates new drawings and applies live to the selected one">size <input type="number" id="drawing_text_size" min="8" max="72" step="1" value="12"></label>
      <label title="Label font weight — templates new drawings and applies live to the selected one">weight
        <select id="drawing_weight">
          <option value="300">300</option>
          <option value="400" selected>400</option>
          <option value="500">500</option>
          <option value="600">600</option>
          <option value="700">700</option>
          <option value="800">800</option>
          <option value="900">900</option>
        </select>
      </label>
      <label title="Italic label glyphs — templates new drawings and applies live to the selected one"><input type="checkbox" id="drawing_italic"> italic</label>
      <button id="clear_drawings" type="button" title="Remove every drawing">clear all</button>
      <span class="hint">Ctrl = snap (while drawing) · Ctrl+click chart = fullscreen · Ctrl+H/V = split ↔/↕ · Shift = straighten</span>
    </div>

    <div class="group" data-caption="Crosshair">
      <label>mode
        <select id="cross_mode">
          <option value="0" selected>normal</option>
          <option value="1">magnet</option>
          <option value="3">magnet OHLC</option>
          <option value="2">hidden</option>
        </select>
      </label>
      <label>color <input type="color" id="cross_color" value="#9598a1"></label>
      <label>w <input type="range" id="cross_width" min="1" max="4" step="1" value="1"><span id="cross_width_val">1</span></label>
      <label>style
        <select id="cross_style">
          <option value="0">solid</option>
          <option value="1">dotted</option>
          <option value="2" selected>dashed</option>
        </select>
      </label>
      <label>label bg <input type="color" id="cross_label_bg" value="#131722"></label>
      <label><input type="checkbox" id="cross_label_visible" checked> labels</label>
    </div>

    <div class="group" data-caption="Chart">
      <label>theme
        <select id="theme_select">
          <option value="light" selected>light</option>
          <option value="dark">dark</option>
        </select>
      </label>
      <label><input type="checkbox" id="grid_toggle" checked> grid</label>
      <label>grid color <input type="color" id="grid_color" value="#d6dcde"></label>
      <label>grid style
        <select id="grid_style">
          <option value="0" selected>solid</option>
          <option value="1">dotted</option>
          <option value="2">dashed</option>
        </select>
      </label>
      <label>font
        <select id="font_family">
          <option value="-apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif" selected>system</option>
          <option value="monospace">monospace</option>
          <option value="Georgia, serif">serif</option>
        </select>
      </label>
      <label>size <input type="range" id="font_size" min="8" max="20" step="1" value="12"><span id="font_size_val">12</span></label>
    </div>

    <div class="group" data-caption="Series chrome" title="Built-in last-price line and last-value axis label on the main series (reference defaults: both on; the line follows the bar direction color)">
      <label><input type="checkbox" id="price_line_toggle" checked> price line</label>
      <label title="Live price line style (price_line_style)">style
        <select id="price_line_style">
          <option value="0">solid</option>
          <option value="1">dotted</option>
          <option value="2" selected>dashed</option>
        </select>
      </label>
      <label><input type="checkbox" id="last_value_toggle" checked> last value</label>
      <label title="TradingView-style title chip in the last-value cluster (darker shade of the label color, left of the price)"><input type="checkbox" id="title_chip_toggle" checked> title chip</label>
      <label>title <input type="text" id="series_title" value="NUCLEUS" size="6"></label>
      <label title="TradingView-style candle-close countdown stacked below the price in the last-value cluster"><input type="checkbox" id="countdown_toggle"> countdown</label>
      <label title="TradingView-style bid/ask lines + Bid/Ask axis chips (default off). Enable to stream synthetic quotes around the last price so the lines and chips move live"><input type="checkbox" id="bid_ask_toggle"> bid/ask</label>
    </div>

    <!-- price/time axis cosmetics: border (reference borderColor/borderVisible) + text (textColor) -->
    <div class="group" data-caption="Axes">
      <label>border <input type="color" id="axis_border_color" value="#f5f5f5"></label>
      <label><input type="checkbox" id="axis_border_visible" checked> borders</label>
      <label>text <input type="color" id="axis_text_color" value="#0a0a0a"></label>
      <label>separator <input type="color" id="pane_separator_color" value="#f5f5f5" title="Pane divider color — follows the axis border color (theme-aware) until you pin an explicit one"></label>
    </div>

    <!-- watermark (reference v4 shape) -->
    <div class="group" id="watermark_group" data-caption="Watermark">
      <label><input type="checkbox" id="wm_visible"> show</label>
      <label>text <input type="text" id="wm_text" value="NUCLEUS" size="6"></label>
      <label>color <input type="color" id="wm_color" value="#b0b8c4"></label>
      <label>size <input type="range" id="wm_size" min="16" max="160" step="4" value="72"><span id="wm_size_val">72</span></label>
    </div>

    <!-- interaction toggles: axis drag-to-scale, mouse kinetic (off by default, reference parity) -->
    <div class="group" id="interaction_group" data-caption="Interaction" title="Drag a price/time axis to scale it; keyboard: arrows pan (Ctrl = fast), +/- zoom, Home fit, Esc clear">
      <label><input type="checkbox" id="axis_scale_toggle" checked> axis drag-scale</label>
      <label><input type="checkbox" id="kinetic_toggle"> mouse kinetic</label>
      <button id="reset_view_btn" type="button" title="Reset the view (TradingView-style): default bar spacing/right offset and autoscale restored on every pane's price scales — a manually contracted scale fits the data again">reset view</button>
      <span class="hint">drag axes · Ctrl+←→ fast scroll · flick coasts on touch</span>
    </div>

    <span id="status"></span>
  </header>
  <div id="chart_wrap">
    <div id="chart_container"></div>
    <div id="legend">O — H — L — C —</div>
  </div>
</div>
<script type="module">
// Built from the real package distribution. The demo build copies @nucleuscharts/financial' published
// artifacts; it does not compile or wire an engine of its own.
import { create_chart, create_chart_grid, create_series_markers, create_text_watermark, default_theme_name, theme_options, theme_palette } from "./dist/nucleuscharts_financial.js";
import { generate_fixture_data } from "./fixture_data.js";
import { fixture_theme } from "./fixture_styles.js";
import { marker_fixture, volume_fixture } from "./fixture_features.js";
import { rounded_candles_pane_view } from "./fixture_custom_series.js";
import { vert_line_canvas_primitive } from "./fixture_canvas_plugin.js";

const container = document.getElementById("chart_container");
const status = document.getElementById("status");

// Deterministic random-walk OHLC data, as the array-of-objects the public API accepts — the
// library packs it into typed arrays at the boundary. Runtime fixtures pin the final timestamp so
// golden output cannot change at an hour boundary while two backends are being captured.
function generate_data(n, fixture = {}) {
  if (fixture.seed !== undefined) return generate_fixture_data({ ...fixture, bar_count: n });
  const out = [];
  let seed = fixture.seed ?? 42;
  // Integer-safe LCG: Math.imul gives the same wrapping-u32 sequence used by the native fixture.
  const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 0xffffffff;
  let price = fixture.start_price ?? 100;
  const hour = 3600;
  const end = fixture.end_time ?? Math.floor(Date.now() / 1000 / hour) * hour;
  const close_span = fixture.close_span ?? 2.4;
  const wick_span = fixture.wick_span ?? 1.2;
  const start = end - (n - 1) * hour;
  for (let i = 0; i < n; i++) {
    const o = price;
    const c = Math.max(1, o + (rnd() - 0.5) * close_span);
    out.push({ time: start + i * hour, open: o, high: Math.max(o, c) + rnd() * wick_span, low: Math.min(o, c) - rnd() * wick_span, close: c });
    price = c;
  }
  return out;
}

const query = new URLSearchParams(location.search);
const requested_backend = query.get("backend");
const runtime_test = query.get("runtimeTest");
const requested_spacing = Number.parseFloat(query.get("spacing") ?? "");
const requested_dpr = Number.parseFloat(query.get("dpr") ?? "");
const theme_param = query.get("theme");
// Runtime fixtures retain their historical light default. The real demo follows the package's
// canonical default, so chart, toolbar, and control values cannot drift when that default changes.
const requested_theme = theme_param === "light" || theme_param === "dark"
  ? theme_param
  : runtime_test === null ? default_theme_name : "light";
sync_page_theme(requested_theme);
const requested_feature = query.get("feature");
const requested_left_scale = query.get("leftScale") === "1";
const parity_fixture = runtime_test === null
  ? null
  : await fetch("./fixtures/d1/candles.json", { cache: "no-store" }).then((response) => response.json());
// External browser runners cannot read a presented WebGPU canvas from page JavaScript. This mode
// removes all non-chart UI so an ordinary viewport screenshot is a stable full-frame artifact.
// backendParity also hides it: its two captures happen on opposite sides of the status-line
// update, and a taller/wrapped toolbar would change the container height between them.
if (runtime_test === "presentedFrame" || runtime_test === "backendParity") {
  document.getElementById("bar").style.display = "none";
  document.getElementById("legend").style.display = "none";
}
const chart_options = {
  autoSize: parity_fixture === null,
  theme: requested_theme,
  // The backend-parity gate must begin on the ordinary automatic path; the second chart is forced
  // to Canvas2D by the separate runtime-test consumer.
  backend: runtime_test === "backendParity" ? "auto" : requested_backend === "canvas2d" ? "canvas2d" : "auto",
};
if (requested_left_scale) {
  chart_options.leftPriceScale = { visible: true };
  chart_options.rightPriceScale = { visible: false };
}
if (parity_fixture !== null) {
  const palette = fixture_theme(requested_theme);
  chart_options.layout = {
    background: { type: "solid", color: palette.background },
    textColor: palette.text,
  };
  chart_options.grid = {
    vertLines: { color: palette.grid },
    horzLines: { color: palette.grid },
  };
  // Keep the cross-library fidelity gate pinned to the reference's axis-border default; the package
  // theme palette (theme.ts) must not leak into the comparison. `boldRoundLabels` is a Nucleus-only
  // extension (default on) with no reference counterpart, so the comparison disables it too.
  chart_options.timeScale = { borderColor: "#2B2B43" };
  chart_options.leftPriceScale = { ...(chart_options.leftPriceScale ?? {}), borderColor: "#2B2B43", boldRoundLabels: false };
  chart_options.rightPriceScale = { ...(chart_options.rightPriceScale ?? {}), borderColor: "#2B2B43", boldRoundLabels: false };
}
if (runtime_test === "adapterFailure") chart_options.__simulate_webgpu_adapter_failure = true;
if (query.get("forceFallbackAdapter") === "1") chart_options.__force_webgpu_fallback_adapter = true;

// The interactive demo is grid-native (the engine workspace): the main chart is the first
// cell, and the Multi-chart toolbar splits/closes further independent charts from there.
// Runtime/parity fixtures keep the exact single-chart path (their manual resize must not race
// a cell auto-resize observer).
let grid = null;
let chart;
if (parity_fixture === null) {
  grid = await create_chart_grid(container, {
    chart_options,
    // Split shortcuts: Ctrl/Cmd+H splits the active cell horizontally, Ctrl/Cmd+V vertically.
    shortcuts: true,
    // Every split-created cell (button OR shortcut) is seeded as a distinct asset — this is
    // what keeps shortcut splits from coming up blank.
    on_cell_added: (cell) => seed_split_cell(cell),
    // The split dividers follow the axis border color (default): same token, theme-aware.
    on_usage: (u) => {
      document.getElementById("grid_usage").textContent =
        `${u.chart_count} chart${u.chart_count === 1 ? "" : "s"} · ${u.split_count} splits`;
    },
  });
  chart = grid.cells()[0].chart;
  window.__grid = grid; // debug/test handle
} else {
  chart = await create_chart(container, chart_options);
}
if (parity_fixture !== null) {
  chart.resize(
    parity_fixture.css_width,
    parity_fixture.css_height,
    Number.isFinite(requested_dpr) ? requested_dpr : parity_fixture.pixel_ratio,
  );
}
window.__chart = chart; // debug/test handle

const data = generate_data(parity_fixture?.bar_count ?? 1000, parity_fixture ?? {});
// Seed the series title on a clean demo load so the title chip renders immediately (the
// engine default "" suppresses it). Fixture/purity runs (?feature/?runtimeTest/params) keep
// the empty title so their pixel baselines stay untouched.
const pristine_demo = query.toString() === "";
const main = chart.add_series("candlestick", {
  ...(requested_left_scale ? { priceScaleId: "left" } : {}),
  ...(pristine_demo ? { title: document.getElementById("series_title").value } : {}),
});
main.set_data(data);
if (grid !== null) {
  // The root cell's primary series under the same handle the split cells get, so the toolbar's
  // series controls (type + style) resolve the ACTIVE cell's series uniformly.
  chart.__seed_series = main;
}
chart.time_scale().fit_content();
if (Number.isFinite(requested_spacing)) {
  chart.time_scale().apply_options({ bar_spacing: requested_spacing, right_offset: 0 });
}
document.documentElement.dataset.barSpacing = String(chart.time_scale().options().bar_spacing);
document.documentElement.dataset.visibleLogicalRange = JSON.stringify(chart.time_scale().get_visible_logical_range());
const visible_price_axis = requested_left_scale ? chart.price_scale("left") : chart.price_scale("right");
document.documentElement.dataset.priceAxisWidth = String(visible_price_axis.width());
container.dataset.priceAxisWidth = String(visible_price_axis.width());
window.__main = main; // debug/test handle
window.__data = data;

// The indicator is produced by Rust and owned by the same engine as the candle series.

// RSI(14) over the main series' closes (Wilder smoothing), rendered as a line series moved
// into its own stacked pane via the public move_to_pane API: the pane gets a dedicated price
// scale and a draggable separator, and removing the series auto-prunes the empty pane.
function rsi_fixture(bars, period = 14) {
  const out = [];
  let avg_gain = 0, avg_loss = 0;
  for (let i = 1; i < bars.length; i++) {
    const change = bars[i].close - bars[i - 1].close;
    const gain = Math.max(change, 0), loss = Math.max(-change, 0);
    if (i <= period) {
      avg_gain += gain / period;
      avg_loss += loss / period;
      if (i < period) continue; // seed window: not enough changes yet
    } else {
      avg_gain = (avg_gain * (period - 1) + gain) / period;
      avg_loss = (avg_loss * (period - 1) + loss) / period;
    }
    out.push({ time: bars[i].time, value: avg_loss === 0 ? 100 : 100 - 100 / (1 + avg_gain / avg_loss) });
  }
  return out;
}
let rsi_series = null;
document.getElementById("rsi_toggle").addEventListener("change", (e) => {
  if (e.target.checked && rsi_series === null) {
    rsi_series = chart.add_series("line", { color: "#ab47bc", line_width: 2, title: "RSI(14)" });
    rsi_series.set_data(rsi_fixture(data));
    // Pane 1 at ~30% of the main pane's stretch (heights split by stretch-factor ratio).
    rsi_series.move_to_pane(1, 0.3);
    // 70/30 guide lines on the oscillator's own scale.
    rsi_series.create_price_line({ price: 70, color: "#787b86", line_width: 1, line_style: 2, title: "" });
    rsi_series.create_price_line({ price: 30, color: "#787b86", line_width: 1, line_style: 2, title: "" });
    window.__rsi = rsi_series; // debug/test handle
  } else if (!e.target.checked && rsi_series !== null) {
    chart.remove_series(rsi_series);
    rsi_series = null;
    window.__rsi = null;
  }
});

// ---- Multi-chart (engine workspace): the main chart is the first cell; the toolbar acts on
// the ACTIVE cell (last clicked) — split/close from the Multi-chart group, series type and
// style from the rest of the toolbar. New cells are seeded as distinct assets and follow the theme.
let active_cell = grid ? grid.cells()[0] : null;
let split_asset_seq = 0;
function seed_split_cell(cell) {
  split_asset_seq += 1;
  const data = generate_data(300, {
    seed: 42 + split_asset_seq * 977,
    start_price: 40 + split_asset_seq * 25,
    close_span: 2.2,
    wick_span: 0.9,
    end_time: data_end_time(),
  });
  const series = cell.chart.add_series("candlestick", { title: `ASSET ${split_asset_seq}` });
  series.set_data(data);
  cell.chart.apply_options(theme_options(document.getElementById("theme_select").value));
  cell.chart.time_scale().fit_content();
  cell.chart.__seed_series = series; // debug/test handle
}
function data_end_time() {
  return data[data.length - 1].time;
}
if (grid !== null) {
  container.addEventListener("pointerdown", (e) => {
    const hit = grid.cells().find((c) => c.element.contains(e.target));
    if (hit && hit !== active_cell) {
      active_cell = hit;
      sync_active_toolbar();
    }
  }, true);
  const split_active = async (direction) => {
    if (!active_cell) return;
    // The grid's on_cell_added hook seeds the new cell (shared with the shortcut path).
    const next = await active_cell.split(direction);
    if (next) {
      active_cell = next;
      sync_active_toolbar();
    }
  };
  document.getElementById("split_h").addEventListener("click", () => split_active("horizontal"));
  document.getElementById("split_v").addEventListener("click", () => split_active("vertical"));
  document.getElementById("close_cell").addEventListener("click", () => {
    // The primary cell hosts all the toolbar wiring — it cannot be closed from here.
    if (active_cell && active_cell.id !== grid.cells()[0].id && active_cell.remove()) {
      active_cell = grid.cells()[0];
      sync_active_toolbar();
    }
  });
  document.getElementById("max_charts").addEventListener("change", (e) => {
    grid.set_max_charts(Number(e.target.value) || null);
  });
}

document.querySelectorAll('input[name="series"]').forEach((el) => {

// Crosshair cosmetics drive both lines at once; the engine stores them per line (reference parity).
function apply_crosshair_style() {
  const color = document.getElementById("cross_color").value;

  const style = Number(document.getElementById("cross_style").value);
  const labelBackgroundColor = document.getElementById("cross_label_bg").value;
  const labelVisible = document.getElementById("cross_label_visible").checked;
  chart.apply_options({
    crosshair: {
      vertLine: { color, width, style, labelBackgroundColor, labelVisible },
      horzLine: { color, width, style, labelBackgroundColor, labelVisible },
    },
  });
}

// ---- interaction toggles: axis drag-to-scale + mouse kinetic. reference/TradingView defaults:
// coasting is a touch behavior (kineticScroll.mouse = false), so mouse kinetic is OFF here by
// default; the checkbox exists to demo it. Touch kinetic stays on regardless (reference parity).
function apply_interaction() {

// Theme presets come from the package's style settings file (theme.ts); applying one maps its
// tokens onto the chart options live (background + axis borders + axis text), then the pickers
// are synced so the controls reflect the active palette. The page chrome follows too.
function sync_page_theme(theme) {
  const palette = theme_palette(theme);
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.setProperty("--demo-surface", palette.background);
  document.documentElement.style.setProperty("--demo-border", palette.border);
  document.documentElement.style.setProperty("--demo-text", palette.text);
  document.getElementById("theme_select").value = theme;
}
document.getElementById("theme_select").addEventListener("change", (e) => {
  const palette = theme_palette(e.target.value);
  // theme_options now includes the grid lines (grid follows the border token per theme).
  chart.apply_options(theme_options(e.target.value));
  // Every split cell follows the theme too; the split dividers re-resolve the border token.
  if (grid !== null) {
    for (const cell of grid.cells()) cell.chart.apply_options(theme_options(e.target.value));
    grid.set_divider_color(null);
  }
  // Follow-or-pin: untouched pickers adopt the new theme tokens; pinned colors are re-applied
  // after the theme patch so a user's explicit choice always wins.
  if (!theme_color_touched.axis_border) document.getElementById("axis_border_color").value = palette.border;
  apply_axis_border();
  if (!theme_color_touched.separator) document.getElementById("pane_separator_color").value = palette.border;
  if (!theme_color_touched.axis_text) document.getElementById("axis_text_color").value = palette.text;
  chart.apply_options({ layout: { textColor: palette.text } });
  if (!theme_color_touched.grid) document.getElementById("grid_color").value = palette.grid;
  apply_grid_style();
  if (!theme_color_touched.crosshair_line) document.getElementById("cross_color").value = palette.crosshair;
  if (!theme_color_touched.crosshair_label) document.getElementById("cross_label_bg").value = palette.crosshair;
  apply_crosshair_style();
  sync_page_theme(e.target.value);
});
// The chart was created with `requested_theme`; mirror that palette into the demo controls.
// Parity fixtures pin their own controls and rendering state.
if (parity_fixture === null) {
  const palette = theme_palette(requested_theme);
  document.getElementById("axis_border_color").value = palette.border;
  apply_axis_border();
  document.getElementById("pane_separator_color").value = palette.border;
  document.getElementById("axis_text_color").value = palette.text;
  document.getElementById("grid_color").value = palette.grid;
  apply_grid_style();
  document.getElementById("cross_color").value = palette.crosshair;
  document.getElementById("cross_label_bg").value = palette.crosshair;
  apply_crosshair_style();
}
sync_style_visibility("candlestick");

// crosshair-move subscription → OHLC legend (the public event API); a hovered primitive
// object (e.g. the position band) shows its external id alongside.
const legend = document.getElementById("legend");
const fmt = (v) => (v === undefined ? "—" : v.toFixed(2));
chart.subscribe_crosshair_move((params) => {
  const bar = params.series_data.get(main);
  const tag = params.hovered_object_id !== null ? `  [${params.hovered_object_id}]` : "";
  if (!bar || params.point === null) { legend.textContent = "O — H — L — C —" + tag; return; }
  legend.textContent = `O ${fmt(bar.open)}  H ${fmt(bar.high)}  L ${fmt(bar.low)}  C ${fmt(bar.close)}` + tag;
});
chart.subscribe_click((params) => {
  if (params.time !== null) console.log("nucleuscharts click @", new Date(params.time * 1000).toISOString());
});

if (runtime_test === "backendParity") {
  const { run_backend_parity } = await import("./runtime_tests.js");
  const result = await run_backend_parity({ create_chart, chart, container, data, fixture: parity_fixture, chart_options });
  window.__backend_parity_result = result;
  document.documentElement.dataset.backendParity = result.status;
  status.textContent = result.status === "passed"
    ? `screenshot API parity PASS · ${result.screenshot_api.different_pixels}/${result.screenshot_api.total_pixels} pixels differ · presented GPU readback ${result.presented_backend_capture}`
    : `backend parity ${result.status.toUpperCase()} · ${result.reason || `${result.different_pixels}/${result.total_pixels} pixels differ · max Δ ${result.maximum_channel_delta} · mean Δ ${result.mean_absolute_channel_delta.toFixed(3)} · GPU ${result.sample_webgpu.corner.join(",")} · 2D ${result.sample_canvas2d.corner.join(",")}`}`;
}
