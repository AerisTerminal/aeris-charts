<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Private Recharts 3.10.1 comparison fixture</title>
  <style>
    :root { font: 14px system-ui, sans-serif; color: #182230; background: #f7f9fc; }
    body { margin: 0; }
    main { box-sizing: border-box; width: 960px; min-height: 600px; padding: 20px; }
    header { display: flex; align-items: baseline; gap: 16px; }
    header p { color: #596579; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    button { border: 1px solid #b8c2d1; border-radius: 4px; background: white; padding: 5px 8px; }
    button[aria-pressed="true"] { color: white; background: #315fc8; }
    section { border: 1px solid #d3dae5; border-radius: 8px; background: white; padding: 12px; }
    section h2, section p { margin: 0 0 8px; }
    .chart { display: flex; flex-wrap: wrap; gap: 8px; width: 760px; min-height: 420px; }
    .chart > div { min-width: 0; }
    output { display: block; max-width: 700px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/dist/g1_recharts_reference.js"></script>
</body>
</html>
