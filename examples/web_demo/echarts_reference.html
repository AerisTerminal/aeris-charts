<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Private Apache ECharts 6.1.0 comparison fixture</title>
  <style>
    :root { font: 14px system-ui, sans-serif; color: #182230; background: #f7f9fc; }
    body { margin: 0; }
    main { box-sizing: border-box; width: 960px; min-height: 600px; padding: 20px; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    nav a { border: 1px solid #b8c2d1; border-radius: 4px; background: white; padding: 5px 8px; color: inherit; text-decoration: none; }
    nav a[aria-current="page"] { color: white; background: #315fc8; }
    section { border: 1px solid #d3dae5; border-radius: 8px; background: white; padding: 12px; }
    section h2 { margin: 0 0 8px; }
    .charts { display: flex; flex-wrap: wrap; gap: 8px; width: 760px; }
    .charts figure { margin: 0; }
    .charts figcaption { font-size: 12px; color: #596579; }
  </style>
</head>
<body>
  <main id="root"></main>
  <script type="module" src="/dist/echarts_reference.js"></script>
</body>
</html>
