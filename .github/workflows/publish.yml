name: Publish

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

permissions:
  contents: read
  packages: write

jobs:
  package:
    name: GitHub Packages publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@nucleuscharts"
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install package deps
        working-directory: packages/charts
        run: npm ci
      - name: Verify tag matches package version
        working-directory: packages/charts
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME !== 'v'+p.version)throw new Error('tag '+process.env.GITHUB_REF_NAME+' does not match package v'+p.version)"
      - name: Publish latest (prepublishOnly rebuilds + pack-smokes first)
        working-directory: packages/charts
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
