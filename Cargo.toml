[workspace]
resolver = "2"
members = [
    "crates/origin_core",
    "crates/origin_indicators",
    "crates/origin_engine",
    "crates/origin_render",
    "crates/origin_render_wgpu",
    "crates/origin_wasm",
    "crates/origin_native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Origin Charts"]
repository = "https://github.com/TradeAion/Origin_charts"

# Shared lint policy; every crate opts in via `[lints] workspace = true`.
# CI enforces clippy with `-D warnings` on top of this.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# wasm release builds care about size too; tune later per-target.
