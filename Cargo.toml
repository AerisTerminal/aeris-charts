[workspace]
resolver = "2"
members = [
    "crates/nucleuscharts_core",
    "crates/nucleuscharts_indicators",
    "crates/nucleuscharts_engine",
    "crates/nucleuscharts_render",
    "crates/nucleuscharts_render_wgpu",
    "crates/nucleuscharts_render_gpui",
    "crates/nucleuscharts_wasm",
    "crates/nucleuscharts_native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["NucleusCharts"]
repository = "https://github.com/NucleusCharts/financial-charts"

# Shared lint policy; every crate opts in via `[lints] workspace = true`.
# CI enforces clippy with `-D warnings` on top of this.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# External deps (wgpu, naga, wasm-bindgen, ...) dominate the wasm binary; our hot loops
# live in workspace crates, which stay at opt-level 3. This trims download size without
# touching engine throughput (headless perf gates measure workspace code).
[profile.release.package."*"]
opt-level = "z"

# wasm release builds care about size too; tune later per-target.
