[workspace]
resolver = "3"
members = [
    "crates/aeris_charts_core",
    "crates/aeris_charts_indicators",
    "crates/aeris_charts_engine",
    "crates/aeris_charts_render",
    "crates/aeris_charts_render_wgpu",
    "crates/aeris_charts_render_gpui",
    "crates/aeris_charts_wasm",
    "crates/aeris_charts_native",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["Aeris Terminal"]
repository = "https://github.com/aeristerminal/aeris-charts"
# Rust crates are consumed from this repository only; nothing is published to crates.io.
publish = false

# Shared lint policy; every crate opts in via `[lints] workspace = true`.
# CI enforces clippy with `-D warnings` on top of this.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# External deps (wgpu, naga, wasm-bindgen, ...) use size optimization in every release build.
# Native workspace crates retain opt-level 3. The published package's build_wasm.mjs applies
# opt-level "z" to the complete WASM graph only, without changing native release throughput.
[profile.release.package."*"]
opt-level = "z"
