[package]
name = "nucleuscharts_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "wasm-bindgen host shell: canvas surface, data ingestion, gestures, RAF plumbing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleuscharts_core = { path = "../nucleuscharts_core" }
nucleuscharts_engine = { path = "../nucleuscharts_engine" }
nucleuscharts_render = { path = "../nucleuscharts_render" }
nucleuscharts_render_wgpu = { path = "../nucleuscharts_render_wgpu" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "HtmlElement",
    "Element",
    "Window",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CssStyleDeclaration",
    "DomRect",
    "TextMetrics",
    # `frame_stats().cpu_ms` clock (telemetry.rs); resolved off the global so it also works in a
    # worker, hence `Performance` rather than `Window::performance` alone.
    "Performance",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "ResizeObserverBoxOptions",
    "console",
] }
wgpu = { version = "25", default-features = false, features = ["webgpu", "wgsl"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true

# wasm-pack runs wasm-opt on release builds (binaryen from the wasm-pack cache).
#
# `--enable-simd` is required, not optional: `.cargo/config.toml` builds wasm32 with
# `+simd128`, so the module contains v128 instructions and wasm-opt refuses to read it
# without the matching feature flag.
#
# Optimization level: `-Oz` stays because package size is a product metric. Evaluate any future
# change with the versioned release artifact and browser scenarios under `benchmarks/`, preserving
# the tradeoff as raw evidence instead of a handwritten performance claim.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-bulk-memory", "--enable-sign-ext", "--enable-simd"]
