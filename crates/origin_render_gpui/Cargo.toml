[package]
name = "origin_render_gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional GPUI executor for the Prim IR: lowers Origin's backend-neutral frame into GPUI scene primitives"

# GPUI itself is OPTIONAL and off by default, so `cargo build/test --workspace` never compiles it
# Normal non-GPUI builds do not compile GPUI. Everything except the thin
# `backend` module — the whole Prim lowering, snapping, cache, and metrics layer — is
# GPUI-free and unit-testable without a window or a GPU.
[features]
default = []
gpui-backend = ["dep:gpui"]

[dependencies]
origin_core = { path = "../origin_core" }
origin_engine = { path = "../origin_engine" }
origin_render = { path = "../origin_render" }

# GPUI is sourced from Zed because Origin and Axiusflow intentionally track the current pre-1.0
# API. The workspace lockfile records the reviewed immutable commit; upgrades are explicit lockfile
# changes and must pass the complete GPUI parity suite.
#
# `default-features = false` keeps unrelated platform feature paths out of the graph, so Windows
# resolves cleanly to GPUI's native backend.
#
# `windows-manifest` is NOT optional on Windows: GPUI imports `comctl32!TaskDialogIndirect`, which
# only resolves under a comctl32 v6 activation context. That context comes from the application
# manifest this feature embeds. Without it the executable fails to load at all
# (STATUS_ENTRYPOINT_NOT_FOUND, 0xC0000139) before `main` runs.
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2", optional = true, default-features = false, features = [
    "windows-manifest",
] }

# The pixel-parity harness diffs GPUI's real output against Origin's existing native rasterizer.
[dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false }
origin_native = { path = "../origin_native" }
sha2 = "=0.10.9"
tiny-skia = "0.11"

[lints]
workspace = true

# The probe needs a real GPUI window, so it only builds with the backend feature. Without this,
# `cargo build --workspace` would try to compile it (and GPUI) unconditionally.
[[example]]
name = "gpui_probe"
required-features = ["gpui-backend"]

[[example]]
name = "pixel_parity"
required-features = ["gpui-backend"]

[[example]]
name = "gpui_pane_capture"
required-features = ["gpui-backend"]
