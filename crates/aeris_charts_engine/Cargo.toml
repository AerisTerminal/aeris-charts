[package]
name = "aeris_charts_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Headless chart model and frame-production state for Aeris Charts"

[features]
# The complete build: whole chart-family modules too large for the standard browser size budget.
# It gates modules only, never options or behavior of families both builds contain.
complete = []

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip keeps decimal parsing correctly rounded so persisted state survives an
# export/import/export cycle bit-exactly (the default fast path double-rounds 17-digit
# significands by up to 1 ulp).
serde_json = { version = "1", features = ["float_roundtrip"] }
aeris_charts_core = { path = "../aeris_charts_core" }
aeris_charts_indicators = { path = "../aeris_charts_indicators" }
aeris_charts_render = { path = "../aeris_charts_render" }

[lints]
workspace = true
