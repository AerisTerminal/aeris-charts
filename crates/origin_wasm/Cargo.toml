[package]
name = "origin_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen host shell: canvas surface, data ingestion, gestures, RAF plumbing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
origin_core = { path = "../origin_core" }
origin_engine = { path = "../origin_engine" }
origin_render = { path = "../origin_render" }
origin_render_wgpu = { path = "../origin_render_wgpu" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "HtmlElement",
    "Element",
    "Window",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CssStyleDeclaration",
    "DomRect",
    "TextMetrics",
    # `frame_stats().cpu_ms` clock (telemetry.rs); resolved off the global so it also works in a
    # worker, hence `Performance` rather than `Window::performance` alone.
    "Performance",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "ResizeObserverBoxOptions",
    "console",
] }
wgpu = { version = "25", default-features = false, features = ["webgpu", "wgsl"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true

# wasm-pack runs wasm-opt at -Oz on release builds (binaryen from the wasm-pack cache).
# Size beats the last few percent of wasm throughput here: the engine hot loops are
# already headless-gated at 5x the 60fps budget, and download size is a product metric.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-bulk-memory", "--enable-sign-ext"]
